<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altınşehir Mersin Tantuni</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial;
  background:#090909;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:25px;
  background:#111;
}

.logo{
  width:200px;
  margin:15px auto;
}

/* NAV */
.nav{
  display:flex;
  justify-content:center;
  gap:10px;
  background:#151515;
  padding:12px;
  position:sticky;
  top:0;
  z-index:10;
}

.nav a{
  color:white;
  text-decoration:none;
  border:1px solid #d89b1d;
  padding:8px 14px;
  border-radius:20px;
  transition:.3s;
}

.nav a.active{
  background:#d89b1d;
  color:black;
  transform:scale(1.1);
}

/* MENU */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#111;
  border:1px solid #d89b1d;
  border-radius:15px;
  padding:20px;
}

.card.active{
  box-shadow:0 0 25px #d89b1d;
  transform:scale(1.03);
  transition:.3s;
}

.card h2{
  text-align:center;
  margin-bottom:15px;
  color:#ffbf3c;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px dashed #444;
}

.price{
  color:#ffbf3c;
}

/* MOBILE */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="hero">
  <img src="logo.png" class="logo">
  <h2>ALTINŞEHİR MERSİN TANTUNİ</h2>
</header>

<nav class="nav">
  <a href="#et">Et</a>
  <a href="#tavuk">Tavuk</a>
  <a href="#cig">Çiğköfte</a>
  <a href="#icecek">İçecek</a>
</nav>

<div class="container">
<div class="grid">

<div class="card" id="et">
<h2>ET TANTUNİ</h2>
<div class="item">Lavaş Et <span class="price">250 TL</span></div>
<div class="item">Somun Et <span class="price">250 TL</span></div>
<div class="item">Yoğurtlu Et <span class="price">280 TL</span></div>
</div>

<div class="card" id="tavuk">
<h2>TAVUK TANTUNİ</h2>
<div class="item">Lavaş Tavuk <span class="price">140 TL</span></div>
<div class="item">Somun Tavuk <span class="price">140 TL</span></div>
<div class="item">Yoğurtlu Tavuk <span class="price">180 TL</span></div>
</div>

<div class="card" id="cig">
<h2>ÇİĞKÖFTE</h2>
<div class="item">Dürüm <span class="price">60 TL</span></div>
<div class="item">Porsiyon <span class="price">200 TL</span></div>
<div class="item">Kilo <span class="price">450 TL</span></div>
</div>

<div class="card" id="icecek">
<h2>İÇECEKLER</h2>
<div class="item">Kutu Kola <span class="price">60 TL</span></div>
<div class="item">Şişe Kola <span class="price">40 TL</span></div>
<div class="item">Şalgam <span class="price">40 TL</span></div>
</div>

</div>
</div>

<script>
// BUTONA BASINCA ORTALA
document.querySelectorAll('.nav a').forEach(link => {
  link.addEventListener('click', function(e){
    e.preventDefault()

    const target = document.querySelector(this.getAttribute('href'))

    target.scrollIntoView({
      behavior:'smooth',
      block:'center'
    })
  })
})

// AKTİF BÖLÜM TAKİBİ
const sections = document.querySelectorAll('.card')
const navLinks = document.querySelectorAll('.nav a')

window.addEventListener('scroll', () => {
  let current = ''

  sections.forEach(section => {
    const rect = section.getBoundingClientRect()
    if(rect.top < window.innerHeight/2 && rect.bottom > window.innerHeight/2){
      current = section.id
    }
  })

  sections.forEach(s => s.classList.remove('active'))
  navLinks.forEach(l => l.classList.remove('active'))

  if(current){
    document.getElementById(current).classList.add('active')
    document.querySelector(`.nav a[href="#${current}"]`).classList.add('active')
  }
})
</script>

</body>
</html>
