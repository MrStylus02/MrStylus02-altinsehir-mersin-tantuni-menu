*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

.top-actions{

.action-btn{

.call-btn{background:linear-gradient(135deg,#0f9b4a,#25d366)}
.insta-btn{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4)}
.cart-top-btn{background:#181818;border:1px solid var(--border)}

.logo{

  max-width:80%;
  margin:12px auto;
  display:block;
  filter:drop-shadow(0 0 20px rgba(0,0,0,.75));
}

h1{

}

.slogan{

}

.sticky-tools{

.tools-inner{

.category-title{

.products-grid{

  grid-template-columns:repeat(3,1fr);
  gap:16px;

.product-card{

.product-image{

.product-body{

.product-head{

.product-name{

.product-desc{

.price{

.cart-overlay{

.cart-drawer{

.cart-items{

.cart-item{

.cart-item-top{

.qty-controls{

.cart-footer{

.total-row{

.customer-note{

  background:#151515;

.order-btn{

  border-radius:15px;
  background:var(--green);

.clear-btn{

.toast{

@media(max-width:900px){

@media(max-width:620px){

const state = {
  activeCategory:"all",
  search:"",
  cart:JSON.parse(localStorage.getItem("altinsehirCart") || "[]")
};

const categoryTabs = document.getElementById("categoryTabs");
const productsGrid = document.getElementById("productsGrid");
const activeCategoryTitle = document.getElementById("activeCategoryTitle");
const resultCount = document.getElementById("resultCount");
const searchInput = document.getElementById("searchInput");

const cartDrawer = document.getElementById("cartDrawer");
const cartOverlay = document.getElementById("cartOverlay");
const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");
const whatsappOrder = document.getElementById("whatsappOrder");
const customerNote = document.getElementById("customerNote");
const cartCountTop = document.getElementById("cartCountTop");
const cartCountFloat = document.getElementById("cartCountFloat");
const toast = document.getElementById("toast");

document.getElementById("openCartTop").onclick = openCart;
document.getElementById("openCartFloat").onclick = openCart;
document.getElementById("closeCart").onclick = closeCart;
cartOverlay.onclick = closeCart;
document.getElementById("clearCart").onclick = clearCart;
customerNote.oninput = updateWhatsappLink;

searchInput.addEventListener("input", function(){
  state.search = this.value.trim().toLocaleLowerCase("tr-TR");
  renderProducts();
});

function formatPrice(value){
  return new Intl.NumberFormat("tr-TR").format(value) + " TL";
}

function renderCategories(){
  categoryTabs.innerHTML = categories.map(cat => `
    <button class="category-tab ${state.activeCategory === cat.id ? "active" : ""}" data-category="${cat.id}">
      ${cat.icon} ${cat.name}
    </button>
  `).join("");

  document.querySelectorAll(".category-tab").forEach(btn => {
    btn.onclick = () => {
      state.activeCategory = btn.dataset.category;
      renderCategories();
      renderProducts();
    };
  });
}

function filteredProducts(){
  return products.filter(p => {
    const categoryOk = state.activeCategory === "all" || p.category === state.activeCategory;
    const text = `${p.name} ${p.desc}`.toLocaleLowerCase("tr-TR");
    const searchOk = !state.search || text.includes(state.search);
    return categoryOk && searchOk;
  });
}

function renderProducts(){
  const list = filteredProducts();
  const category = categories.find(c => c.id === state.activeCategory);

  activeCategoryTitle.textContent = state.search ? `"${state.search}" arama sonucu` : category.name;
  resultCount.textContent = `${list.length} ürün`;

  if(list.length === 0){
    productsGrid.innerHTML = `<div class="empty-state">Ürün bulunamadı.</div>`;
    return;
  }

  productsGrid.innerHTML = list.map(p => `
    <article class="product-card">
      <img
        class="product-image"
        src="${p.image}"
        alt="${p.name}"
        loading="lazy"
        onerror="this.src='logo.png'"
      />

      <div class="product-body">
        <div class="product-head">
          <div>
            <h3 class="product-name">${p.name}</h3>
            <p class="product-desc">${p.desc}</p>
          </div>
          <span class="price">${formatPrice(p.price)}</span>
        </div>

        ${p.badge ? `<span class="badge">${p.badge}</span>` : ""}

        <button class="add-btn" data-id="${p.id}">
          Sepete Ekle
        </button>
      </div>
    </article>
  `).join("");

  document.querySelectorAll(".add-btn").forEach(btn => {
    btn.onclick = () => addToCart(btn.dataset.id);
  });
}

function addToCart(id){
  const item = state.cart.find(i => i.id === id);
  if(item) item.qty++;
  else state.cart.push({id, qty:1});

  saveCart();
  renderCart();
  showToast("Ürün sepete eklendi");
}

function increaseQty(id){
  const item = state.cart.find(i => i.id === id);
  if(item) item.qty++;
  saveCart();
  renderCart();
}

function decreaseQty(id){
  const item = state.cart.find(i => i.id === id);
  if(!item) return;

  item.qty--;
  if(item.qty <= 0){
    state.cart = state.cart.filter(i => i.id !== id);
  }

  saveCart();
  renderCart();
}

function removeFromCart(id){
  state.cart = state.cart.filter(i => i.id !== id);
  saveCart();
  renderCart();
}

function clearCart(){
  state.cart = [];
  saveCart();
  renderCart();
}

function cartDetails(){
  return state.cart.map(i => {
    const p = products.find(product => product.id === i.id);
    if(!p) return null;
    return {...p, qty:i.qty, total:p.price * i.qty};
  }).filter(Boolean);
}

function cartTotalPrice(){
  return cartDetails().reduce((sum, i) => sum + i.total, 0);
}

function renderCart(){
  const list = cartDetails();
  const count = list.reduce((sum, i) => sum + i.qty, 0);

  cartCountTop.textContent = count;
  cartCountFloat.textContent = count;
  cartTotal.textContent = formatPrice(cartTotalPrice());

  if(list.length === 0){
    cartItems.innerHTML = `<div class="empty-state">Sepetin boş.</div>`;
  }else{
    cartItems.innerHTML = list.map(i => `
      <div class="cart-item">
        <div class="cart-item-top">
          <div>
            <strong>${i.name}</strong>
            <div class="product-desc">${formatPrice(i.price)} x ${i.qty}</div>
          </div>
          <strong style="color:var(--gold)">${formatPrice(i.total)}</strong>
        </div>

        <div class="qty-controls">
          <div>
            <button class="qty-btn" onclick="decreaseQty('${i.id}')">−</button>
            <strong>${i.qty}</strong>
            <button class="qty-btn" onclick="increaseQty('${i.id}')">+</button>
          </div>
          <button class="remove-btn" onclick="removeFromCart('${i.id}')">Sil</button>
        </div>
      </div>
    `).join("");
  }

  updateWhatsappLink();
}

function updateWhatsappLink(){
  const list = cartDetails();

  if(list.length === 0){
    whatsappOrder.href = `https://wa.me/${RESTAURANT.phone}?text=${encodeURIComponent("Merhaba, menüden sipariş vermek istiyorum.")}`;
    return;
  }

  const lines = [];
  lines.push(`Merhaba ${RESTAURANT.name}, sipariş vermek istiyorum.`);
  lines.push("");
  lines.push("Siparişim:");

  list.forEach(i => {
    lines.push(`- ${i.qty} adet ${i.name} = ${formatPrice(i.total)}`);
  });

  lines.push("");
  lines.push(`Toplam: ${formatPrice(cartTotalPrice())}`);

  const note = customerNote.value.trim();
  if(note){
    lines.push("");
    lines.push(`Not: ${note}`);
  }

  whatsappOrder.href = `https://wa.me/${RESTAURANT.phone}?text=${encodeURIComponent(lines.join("\n"))}`;
}

function openCart(){
  cartOverlay.classList.add("show");
  cartDrawer.classList.add("show");
}

function closeCart(){
  cartOverlay.classList.remove("show");
  cartDrawer.classList.remove("show");
}

function saveCart(){
  localStorage.setItem("altinsehirCart", JSON.stringify(state.cart));
}

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1600);
}

renderCategories();
renderProducts();
renderCart();
</script>

</body>
</html>
